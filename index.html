<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Odd One Out - Cooking Methods</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background-color: #fff;
            max-width: 800px;
            width: 100%;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .instruction {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .food-card {
            background-color: #fcfcfc;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .food-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #444;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .option-btn {
            padding: 10px 16px;
            font-size: 1rem;
            font-weight: 500;
            border: 2px solid #ccc;
            border-radius: 8px;
            background-color: white;
            color: #333;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #2196F3;
            background-color: #e3f2fd;
        }

        /* Feedback States */
        .option-btn.correct {
            border-color: #4CAF50;
            background-color: #e8f5e9;
            color: #2e7d32;
            transform: scale(1.05);
        }

        .option-btn.incorrect {
            border-color: #f44336;
            background-color: #ffebee;
            color: #c62828;
            animation: shake 0.3s;
        }
        
        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }
        .option-btn.correct:disabled {
            opacity: 1;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .controls {
            text-align: center;
            margin-top: 40px;
        }

        #reset-btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background-color: #f48fb1;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #reset-btn:hover {
            background-color: #f06292;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Find the Odd One Out! 🕵️‍♂️</h1>
        <p class="instruction">Click the cooking method that does <strong>NOT</strong> belong to the food item listed.</p>

        <div class="grid-container" id="game-board">
            <!-- Cards will be generated by JavaScript -->
        </div>

        <div class="controls">
            <button id="reset-btn">Play Again</button>
        </div>
    </div>

    <script>
        // Data based on the image provided, with one odd one out per category
        const gameData = [
            {
                food: "Eggs",
                icon: "🥚",
                options: [
                    { text: "Scrambled", correct: false },
                    { text: "Poached", correct: false },
                    { text: "Boiled", correct: false },
                    { text: "Mashed", correct: true } // Mashed is for potatoes/chicken
                ]
            },
            {
                food: "Potatoes",
                icon: "🥔",
                options: [
                    { text: "Baked", correct: false },
                    { text: "Roast", correct: false },
                    { text: "Mashed", correct: false },
                    { text: "Poached", correct: true } // Poached is for eggs/fish
                ]
            },
            {
                food: "Vegetables",
                icon: "🥦",
                options: [
                    { text: "Pickled", correct: false },
                    { text: "Boiled", correct: false },
                    { text: "Steamed", correct: false },
                    { text: "Grilled", correct: true } // Grilled is not listed for veg in the image
                ]
            },
            {
                food: "Chicken",
                icon: "🍗",
                options: [
                    { text: "Roast", correct: false },
                    { text: "Baked", correct: false },
                    { text: "Fried", correct: false },
                    { text: "Scrambled", correct: true } // Scrambled is for eggs/veg
                ]
            },
            {
                food: "Rice",
                icon: "🍚",
                options: [
                    { text: "Boiled", correct: false },
                    { text: "Fried", correct: false },
                    { text: "Steamed", correct: false },
                    { text: "Pickled", correct: true } // Pickled is for potatoes/veg
                ]
            },
            {
                food: "Fish",
                icon: "🐟",
                options: [
                    { text: "Baked", correct: false },
                    { text: "Grilled", correct: false },
                    { text: "Poached", correct: false },
                    { text: "Mashed", correct: true } // Mashed is for potatoes/chicken
                ]
            }
        ];

        const gameBoard = document.getElementById('game-board');
        const resetBtn = document.getElementById('reset-btn');

        function initGame() {
            gameBoard.innerHTML = ''; // Clear board

            gameData.forEach((item, index) => {
                // Create Card
                const card = document.createElement('div');
                card.className = 'food-card';
                
                // Card Title
                card.innerHTML = `<div class="food-title"><span>${item.icon}</span> ${item.food}:</div>`;
                
                // Options Container
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';

                // Shuffle options so the odd one isn't always in the same position
                const shuffledOptions = [...item.options].sort(() => Math.random() - 0.5);

                shuffledOptions.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt.text;
                    
                    btn.addEventListener('click', () => {
                        // Disable all buttons in this card once clicked
                        const cardButtons = optionsDiv.querySelectorAll('button');
                        
                        if (opt.correct) {
                            btn.classList.add('correct');
                            // Disable others to prevent multiple guesses
                            cardButtons.forEach(b => {
                                if (b !== btn) b.disabled = true;
                            });
                        } else {
                            btn.classList.add('incorrect');
                            btn.disabled = true;
                        }
                    });

                    optionsDiv.appendChild(btn);
                });

                card.appendChild(optionsDiv);
                gameBoard.appendChild(card);
            });
        }

        // Initialize on load
        initGame();

        // Reset button functionality
        resetBtn.addEventListener('click', initGame);

    </script>
</body>
</html>
